name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build and Release Windows Binaries
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync

      - name: Build project assets (Extensions + JupyterLite)
        run: npm run build

      - name: Package Windows installer & portable binary
        run: npm run package:win

      - name: Scan build artifacts with Microsoft Defender
        shell: pwsh
        run: |
          $scanPath = (Resolve-Path "dist").Path
          Write-Host "Scanning $scanPath with Microsoft Defender..."
          & "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$scanPath"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Malware or threat detected by Microsoft Defender! Exit code: $LASTEXITCODE"
            exit 1
          }
          Write-Host "Microsoft Defender scan passed successfully."

      - name: Generate Checksums & VirusTotal Links
        id: vt_links
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist/*.exe, dist/*.zip
          $hashLines = @()
          $vtMarkdown = @()

          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $hashLines += "$hash  $($file.Name)"
            $vtMarkdown += "- **$($file.Name)**: [View VirusTotal Report](https://www.virustotal.com/gui/file/$hash) (`$($hash)`)"
          }

          # SHA256SUMS.txt を出力
          $hashLines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

          # リリースノート埋め込み用のMarkdownを変数に保存
          $vtReportBody = $vtMarkdown -join "`n"
          "VT_REPORTS<<EOF" >> $env:GITHUB_ENV
          "$vtReportBody" >> $env:GITHUB_ENV
          "EOF" >> $env:GITHUB_ENV

      - name: Attest Build Provenance (Artifact Attestations)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-snapshot' }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## 📦 Release Assets
            - **Installer (NSIS)**: `setup.exe`
            - **Portable Version**: `.zip`
            - **Checksum File**: `SHA256SUMS.txt`

            ## 🛡️ Security & Integrity Verification
            - **SLSA Provenance**: Artifact Attestations are attached to this release and can be verified via GitHub CLI (`gh attestation verify`).
            - **VirusTotal Reports**:
            ${{ env.VT_REPORTS }}

            > ℹ️ *Note: Newly built binaries may initially display **"Item not found"** on VirusTotal until first analyzed. You can upload the binary to VirusTotal to trigger an instant scan.*

            ### PowerShell Checksum Verification
            ```powershell
            # Verify SHA-256 hash of downloaded file
            Get-FileHash .\<Downloaded-Package-Name> -Algorithm SHA256
            ```

            ### ⚠️ Windows SmartScreen Notice
            Unsigned or newly signed open-source binaries may trigger Windows SmartScreen warnings ("Windows protected your PC").
            1. Click **"More info"** ("詳細情報").
            2. Click **"Run anyway"** ("実行").

